services:
  app:
    build: . 
    container_name: bunnies_app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    networks:
      - bunnies_network
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: bunnies_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bunniesAndTea
      MYSQL_USER: user_bunnies
      MYSQL_PASSWORD: user_password
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - bunnies_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bunnies_phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=user_bunnies
      - PMA_PASSWORD=user_password
    networks:
      - bunnies_network
    depends_on:
      - db

networks:
  bunnies_network:
    driver: bridge